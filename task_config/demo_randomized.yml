# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 0
episode_num: 10
use_seed: false
save_freq: 15
embodiment: [trlc-dk1, trlc-dk1, 0.7]
language_num: 100
domain_randomization:
  random_background: true
  cluttered_table: true
  clean_background_rate: 0.02
  random_head_camera_dis: 0
  random_table_height: 0.03
  random_light: true
  crazy_random_light_rate: 0.02
  block_variation:
    num_distractors: 3        # Add 3 distractor cubes (0 = original behavior)
    size_variation: [0.7, 1.3] # Sizes from 70% to 130% of base (2.5cm)
    randomize_colors: true    # Random colors for target blocks too
  random_start_pose:
    probability: 1.0          # Always use random start position for testing
    height_range: [0.08, 0.25] # 8-25cm above table
    offset_range: [0.10, 0.25] # 10-25cm horizontal offset from target block

camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
